<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- windeploy: the Pharos of Alexandria, light reaching out to the computers -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#1d4f7c"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e3bf"/>
      <stop offset="0.55" stop-color="#e2c890"/>
      <stop offset="1" stop-color="#c7a867"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="62" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="44" fill="url(#sky)"/>

  <!-- light beams -->
  <path d="M128 62 L8 22 L8 70 Z" fill="url(#glow)"/>
  <path d="M128 62 L248 22 L248 70 Z" fill="url(#glow)"/>
  <circle cx="128" cy="62" r="30" fill="#ffd66b" opacity="0.35"/>

  <!-- sea and rock -->
  <path d="M0 214 Q32 204 64 214 T128 214 T192 214 T256 214 L256 212 L256 256 L0 256 Z" fill="#163c61"/>
  <path d="M60 222 L196 222 L186 206 L70 206 Z" fill="#6b7f93"/>

  <!-- tier 1: square base -->
  <path d="M84 206 L172 206 L164 128 L92 128 Z" fill="url(#stone)"/>
  <rect x="88" y="124" width="80" height="8" rx="2" fill="#c7a867"/>
  <rect x="120" y="178" width="16" height="28" rx="8" fill="#8a6d3b"/>
  <rect x="104" y="144" width="10" height="16" rx="5" fill="#8a6d3b"/>
  <rect x="142" y="144" width="10" height="16" rx="5" fill="#8a6d3b"/>

  <!-- tier 2: octagon -->
  <path d="M100 124 L156 124 L151 92 L105 92 Z" fill="url(#stone)"/>
  <rect x="102" y="88" width="52" height="7" rx="2" fill="#c7a867"/>
  <rect x="123" y="102" width="10" height="14" rx="5" fill="#8a6d3b"/>

  <!-- tier 3: round top with fire -->
  <path d="M112 88 L144 88 L141 70 L115 70 Z" fill="url(#stone)"/>
  <path d="M110 70 L146 70 L128 58 Z" fill="#c7a867"/>
  <path d="M128 30 C138 42 140 50 134 58 C132 52 129 50 128 46 C127 50 124 52 122 58 C116 50 118 42 128 30 Z" fill="#ff9d2e"/>
  <path d="M128 40 C133 47 134 52 131 58 L125 58 C122 52 123 47 128 40 Z" fill="#ffe27a"/>
</svg>
