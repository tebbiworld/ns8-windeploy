# Paths included in the module backup (state/environment is always included).
#   state/passwords.env    service account password
#   state/deployments.json deployments and the GUIDs of their GPOs
#   state/policies.json    policy profiles and the GUIDs of their GPOs
#   state/policy-log.jsonl changes of the policy profiles, with their reasons
#   state/deployment-log.jsonl removals of deployments, with their reasons
#   state/dns-log.jsonl    changes of DNS records made through the module
#   state/dns-backups      records of deleted DNS zones
#   state/gpo-backups      previous GPO files, written before every change
# The package index (state/wingetindex) is downloaded again after a restore.
state/passwords.env
state/deployments.json
state/policies.json
state/policy-log.jsonl
state/deployment-log.jsonl
state/dns-log.jsonl
state/dns-backups
state/gpo-backups
